[project]
name = "agent-forge"
version = "0.1.0"
description = "基于 LangGraph 的多 Agent 协作框架"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "langgraph>=0.2.0,<0.4.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4.0",
]
dashboard = [
    "streamlit>=1.30",
]
mcp = [
    "mcp>=1.0,<2.0",
    "langchain-mcp-adapters>=0.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_forge*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that require LLM API calls (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"benchmark/tasks/**/*.py" = ["E501"]
